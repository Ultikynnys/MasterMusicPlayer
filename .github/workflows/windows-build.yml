name: Windows Build

'on':
  workflow_dispatch:
    inputs:
      build_name:
        description: Build artifact name
        required: false
        default: windows-build
  push:
    paths:
      - .github/workflows/windows-build.yml

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows Installer
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Increment patch version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json
          $currentVersion = [version]$package.version
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read published release versions.'
          }
          foreach ($tag in $releases) {
            if ($tag -match '^(?:v|build-)?(\d+\.\d+\.\d+)(?:-\d+-\d+)?$') {
              $publishedVersion = [version]$Matches[1]
              if ($publishedVersion -gt $currentVersion) {
                $currentVersion = $publishedVersion
              }
            }
          }
          $nextVersion = "$($currentVersion.Major).$($currentVersion.Minor).$($currentVersion.Build + 1)"
          npm version $nextVersion --no-git-tag-version
          if ($LASTEXITCODE -ne 0) {
            throw 'Patch version increment failed.'
          }
          "BUILD_VERSION=$nextVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows package
        run: npm run build-optimized -- --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.build_name }}-${{ env.BUILD_VERSION }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:BUILD_VERSION
          $assets = @(Get-ChildItem -Path 'dist' -File | Where-Object {
            $_.Name.EndsWith('.exe') -or $_.Name.EndsWith('.exe.blockmap')
          } | ForEach-Object { $_.FullName })
          if (-not ($assets | Where-Object { $_.EndsWith('.exe') })) {
            throw 'No Windows installer found to publish.'
          }
          $notes = "Windows installer built from commit $env:GITHUB_SHA.`n`nBuild: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Master Music Player $env:BUILD_VERSION" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release publication failed.'
          }
